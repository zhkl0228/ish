name: CI

on:
  push:
  pull_request:
      branches: [master]

jobs:
  linux:
    # The CLI on an AArch64 host, and tests/regress run with it
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld meson ninja-build pkg-config libsqlite3-dev libarchive-dev \
              musl-tools python3 curl
      - name: Build and test
        run: tests/regress/ci.sh "$RUNNER_TEMP/ci"

  mac:
    # The app as it is built for a phone, unsigned
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
        with:
            submodules: true
      - name: Install dependencies
        run: |
          brew install llvm lld ninja libarchive meson
      - name: Build
        run: xcodebuild -project iSH.xcodeproj -scheme iSH-ARM64 -arch arm64 -sdk iphoneos CODE_SIGNING_ALLOWED=NO
