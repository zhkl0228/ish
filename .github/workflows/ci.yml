name: CI

on:
  push:
  pull_request:
      branches: [master]
  workflow_dispatch:
    inputs:
      force:
        description: Publish the ipa even if its version is published (it is replaced)
        type: boolean
        default: false

jobs:
  linux:
    # The CLI on an AArch64 host, and tests/regress run with it
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld meson ninja-build pkg-config libsqlite3-dev libarchive-dev \
              python3 curl
      - name: Allow ICMP sockets
        # A guest's ICMP socket is a host one of SOCK_DGRAM (fs/sock.h), which
        # Linux makes for a group in net.ipv4.ping_group_range only: the
        # runner's is none ("1 0"), where Docker's, macOS's and iOS's allow
        # any (regress_proc_net's raw socket)
        run: sudo sysctl -w net.ipv4.ping_group_range="0 2147483647"
      - name: Build and test
        run: tests/regress/ci.sh "$RUNNER_TEMP/ci"
      - name: Keep the guest's programs
        # for mac-regress, whatever the tests found: they are compiled before
        # each runs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: guest-programs
          path: ${{ runner.temp }}/ci/guest-programs
          retention-days: 3
          if-no-files-found: error

  mac-regress:
    # The CLI on macOS, the app's host as iOS is, and tests/regress run with it
    # (tests/regress/ci-mac.sh): what only Darwin does, the linux job does not
    # see. Its guest's programs are the linux job's, compiled in Alpine. On
    # the mac job's image, xcode-27, which it gets at once: on macos-26 it
    # waited 15 minutes and GitHub gave up ("not acquired by Runner of type
    # hosted even after multiple attempts"; macOS arm64 runners short)
    needs: linux
    if: ${{ !cancelled() }}
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        # lld: the vDSO is linked as a Linux ELF (vdso/arm64, -fuse-ld=lld)
        run: brew install meson ninja libarchive coreutils lld
      - uses: actions/download-artifact@v8
        with:
          name: guest-programs
          path: ${{ runner.temp }}/guest-programs
      - name: Build and test
        run: tests/regress/ci-mac.sh "$RUNNER_TEMP/ci" "$RUNNER_TEMP/guest-programs"
      - name: Keep iSH's crash reports
        # macOS writes one for each iSH that dies of a signal (the trap of a
        # pthread call's error, util/sync.h): its threads' stacks, iSH's
        # symbols in them
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: mac-regress-crash-reports
          path: ~/Library/Logs/DiagnosticReports/ish*
          retention-days: 7
          if-no-files-found: warn

  mac:
    # The app as it is built for a phone (archived, unsigned) and its ipa. On
    # master the ipa is published as a release, ipa-<version>-<build>, when
    # its version is not (app/AppARM64.xcconfig's MARKETING_VERSION and
    # CURRENT_PROJECT_VERSION, which FileProviderARM64.xcconfig's match;
    # aot-images.yml raises the build with each set of images it commits), or
    # again, replacing it, when a commit of the push says [ipa] in its message
    # (or a run by hand says force); the newest five kept. To install it, sign
    # it with one's own developer account. Each release also carries
    # source.json (app/altsource.py), the AltStore source that lists it: added
    # to Feather once as releases/latest/download/source.json, it shows each
    # new build when refreshed. Built with Xcode 27.2 (the xcode-27
    # image, macOS 27, whose default is 27.1), as on a Mac: built with
    # macos-26's Xcode 26.6 (the iOS 26.5 SDK), the app stayed the size of a
    # folded phone when the phone unfolded, where a Mac's build with Xcode 27
    # fills the screen
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
            submodules: true
      - name: Install dependencies
        run: |
          brew install llvm lld ninja libarchive meson xcodegen
      - name: StikJIT
        # The JIT helper extension's framework (app/StikJIT/build.sh)
        run: app/StikJIT/build.sh
      - name: idevice
        # The on-device pairing's library (app/idevice/build.sh), in Rust
        run: |
          if ! command -v rustup > /dev/null; then
              brew install rustup
              export PATH="$(brew --prefix rustup)/bin:$PATH"
              echo "$(brew --prefix rustup)/bin" >> "$GITHUB_PATH"
          fi
          rustup default stable
          rustup target add aarch64-apple-ios
          app/idevice/build.sh
      - name: Build
        run: |
          xcodebuild -project iSH.xcodeproj -scheme iSH-ARM64 -arch arm64 -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -archivePath "$RUNNER_TEMP/iSH-ARM64.xcarchive" CODE_SIGNING_ALLOWED=NO archive
      - name: Package
        id: package
        run: python3 app/package-ipa.py "$RUNNER_TEMP/iSH-ARM64.xcarchive" "$RUNNER_TEMP/ipa"
      - name: Release
        if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.package.outputs.version }}
          BUILD: ${{ steps.package.outputs.build }}
          FORCE: ${{ inputs.force == true || contains(join(github.event.commits.*.message, ' '), '[ipa]') }}
        run: |
          set -o pipefail
          tag="ipa-$VERSION-$BUILD"
          if gh release view "$tag" > /dev/null 2>&1; then
              if [ "$FORCE" != true ]; then
                  echo "$tag is published: a new version (app/AppARM64.xcconfig) or [ipa] in a commit's message publishes one"
                  exit 0
              fi
              gh release delete "$tag" --cleanup-tag --yes
          fi
          sha=${GITHUB_SHA::8}
          printf '%s (%s)\n\nUnsigned: sign it with your own developer account to install it.\n' \
              "$(git log -1 --format=%s "$GITHUB_SHA")" "$sha" > "$RUNNER_TEMP/notes.md"
          python3 app/altsource.py "$RUNNER_TEMP/ipa/iSH-ARM64-unsigned.ipa" "$GH_REPO" "$tag" \
              "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$RUNNER_TEMP/ipa/source.json"
          gh release create "$tag" --target "$GITHUB_SHA" --latest \
              --title "iSH-ARM64 $VERSION ($BUILD)" --notes-file "$RUNNER_TEMP/notes.md" \
              "$RUNNER_TEMP/ipa/iSH-ARM64-unsigned.ipa" "$RUNNER_TEMP/ipa/iSH-ARM64-dSYMs.zip" \
              "$RUNNER_TEMP/ipa/source.json"
          # the newest five ipa releases kept, the rest removed with their tags
          gh release list --limit 100 --json tagName,createdAt \
              --jq '[.[] | select(.tagName | startswith("ipa-"))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
          while read -r old; do
              gh release delete "$old" --cleanup-tag --yes
          done
