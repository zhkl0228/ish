# The app's AOT images: recorded and published again when they no longer serve
# what the app runs (benchmark/aojit/ci_app_images.sh), then the new lock,
# app/AOTImages.xcconfig and ish-install's versions committed to master with the
# app's build number one more, and the app's build (ci.yml) run on it, which
# publishes its ipa as a new build. A pull request instead only when that commit
# cannot go onto master as it is now (a conflict, or master protected).
#
# Needs the secret AOT_SSH_KEY (the upload key of user ish-aot on hk.gzmtx.cn,
# which can only rsync into the images' directory), and, for the pull request,
# "Allow GitHub Actions to create and approve pull requests" (Settings > Actions
# > General).
name: AOT images

on:
  push:
    branches: [master]
    # what ish's abi depends on, and the recording itself
    paths:
      - 'asbestos/**'
      - 'emu/**'
      - 'kernel/**'
      - 'meson.build'
      - 'meson_options.txt'
      - 'tools/jit_aot/**'
      - 'benchmark/aojit/**'
      - '.github/workflows/aot-images.yml'
  schedule:
    # new versions of Claude Code, Kimi Code and Alpine's packages: 04:00 in China
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Record even if nothing changed
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  # to run ci.yml on the commit: a push by GITHUB_TOKEN starts no workflow
  actions: write

concurrency:
  group: aot-images
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # The branch as it is now, not as it was when the run was made: a run
      # queued behind another (concurrency) checked out the commit before the
      # other's set, and recorded the same images again; and its commit, on
      # that, could not go onto master, nor its pull request be pushed (a
      # branch whose workflow files differ from master's needs the workflows
      # permission). 2026-11-26: a scheduled run cloned 31 seconds before a
      # run by hand committed its set.
      - name: The branch as it is now
        run: |
          git fetch -q origin "$GITHUB_REF_NAME"
          git reset -q --hard FETCH_HEAD

      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq meson ninja-build pkg-config clang clang-20 libsqlite3-dev libarchive-dev \
              python3-tqdm rsync xz-utils

      - name: Upload key
        env:
          AOT_SSH_KEY: ${{ secrets.AOT_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$AOT_SSH_KEY" > ~/.ssh/ish_aot_ci
          chmod 600 ~/.ssh/ish_aot_ci
          echo 'hk.gzmtx.cn ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINf3KzmJXiuswc0NBcYZy3vGYF9/Rg2yJb/eLJItOWpp' >> ~/.ssh/known_hosts

      - name: Record and publish if the images no longer serve the app
        run: benchmark/aojit/ci_app_images.sh ${{ inputs.force && '--force' || '' }}

      - name: Commit to master
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="benchmark/aojit/app-images.lock.json app/AOTImages.xcconfig app/RootfsPatch.bundle"
          if git diff --quiet -- $files; then
            echo "nothing published"
            exit 0
          fi
          # the app that links them is a new build: its number (its extensions'
          # with it) one more, so that ci.yml publishes its ipa, ipa-<version>-<build>
          build=$(($(sed -n 's/^CURRENT_PROJECT_VERSION = //p' app/AppARM64.xcconfig) + 1))
          versioned="app/AppARM64.xcconfig app/FileProviderARM64.xcconfig app/JITHelperARM64.xcconfig app/LoopbackTunnelARM64.xcconfig"
          sed -i "s/^CURRENT_PROJECT_VERSION = .*/CURRENT_PROJECT_VERSION = $build/" $versioned
          files="$files $versioned"
          set=$(python3 -c "import json; print(json.load(open('benchmark/aojit/app-images.lock.json'))['set'])")
          summary=$(python3 -c "
          import json
          d = json.load(open('benchmark/aojit/app-images.lock.json'))
          r = d['recorded']
          print('abi %s; ' % d['abi'] + ', '.join('%s %s' % i for i in sorted(r['npm'].items())) + '; ' +
                ', '.join('%s %s' % i for i in sorted(r['apk'].items())))")
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- $files
          git commit -q -m "aot: the app's images, set $set" \
              -m "Recorded on $summary (benchmark/aojit/ci_app_images.sh). The app's build $build links them."
          # master may have moved in the hours the recording took. A commit onto
          # it as it is now, or else a pull request: nothing recorded is lost
          if git pull -q --rebase origin master && git push -q origin HEAD:master; then
            echo "committed to master"
            gh workflow run ci.yml --ref master
            exit 0
          fi
          git rebase --abort 2> /dev/null || true
          git switch -c "aot/$set"
          git push -q origin "aot/$set"
          gh pr create --base master --head "aot/$set" --title "aot: the app's images, set $set" \
              --body "Recorded on $summary, and published to hk.gzmtx.cn/ish-aot/$set. Not committed to master, which it could not go onto as it is now: merging makes the app's build $build link them and ish-install install those versions."
